<!--/*
  The page shell shared by both modes: index.html and helper.html replace their <html> with
  page(content), passing the contents of <main>. (The doctype is in those pages, since only
  this <html> element is used.)
*/-->
<html lang="en" th:fragment="page(content)" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <title th:text="|${framework} · Stencil SSR WASM|">Framework · Stencil SSR WASM</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; }
      main > * { margin-bottom: 1.5rem; }
      .demo-notice { display: block; padding: .75rem 1rem; border-radius: 6px; background: #eef2ff; }
      .demo-notice--error { background: #fee2e2; }
    </style>
    <script type="module" src="/stencil/demo-components.esm.js"></script>
  </head>
  <body>
    <main>
      <h1 th:text="|${framework} + Stencil SSR WASM|">Framework + Stencil SSR WASM</h1>
      <th:block th:replace="${content}"/>
    </main>
  </body>
</html>
