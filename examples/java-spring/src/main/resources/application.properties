spring.application.name=java-spring
server.port=${PORT:8006}

# Plugin and client bundle. Defaults point at packages/components/dist, for running from a checkout.
ssr.wasm-path=${SSR_WASM_PATH:../../packages/components/dist/ssr-wasm/index.wasm}
ssr.pool-size=${SSR_POOL_SIZE:0}
ssr.acquire-timeout=30s
ssr.call-timeout=30s
stencil.client-dir=${STENCIL_CLIENT_DIR:../../packages/components/dist/loader-bundle/demo-components}

# Only /stencil/** serves static files (see WebConfig); no classpath:/static etc.
spring.web.resources.add-mappings=false

# Render the whole template before writing, so helper mode can still set Server-Timing after
# the last fragment (and a template error is a clean 500, not half a page).
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

server.shutdown=graceful
spring.main.banner-mode=off
